version: '3.8'

services:
  # Backend API Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-companion-backend
    ports:
      - "8000:8000"
    environment:
      # JWT Configuration
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # AWS Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      
      # GCP Configuration
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/gcp-credentials.json}
      
      # Application Configuration
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
    volumes:
      # SSH Keys for AWS Lightsail access
      - ./ssh-keys:/home/appuser/.ssh:ro
      
      # GCP Service Account Key (if using file-based auth)
      - ${GCP_SERVICE_ACCOUNT_KEY_PATH:-./gcp-credentials.json}:/app/gcp-credentials.json:ro
      
      # Application logs
      - ./logs:/app/logs
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - devops-network

  # Expo Development Server
  expo:
    image: node:18-alpine
    container_name: devops-companion-expo
    working_dir: /app
    ports:
      - "19000:19000"  # Expo DevTools
      - "19001:19001"  # Expo Metro
      - "19002:19002"  # Expo Tunnel
    volumes:
      - ./DevOpsCompanionMobile:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - EXPO_TUNNEL_SUBDOMAIN=${EXPO_TUNNEL_SUBDOMAIN:-devops-companion}
    command: >
      sh -c "
        npm install &&
        npx expo start --tunnel --host 0.0.0.0
      "
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - devops-network

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: devops-companion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - devops-network

volumes:
  redis_data:

networks:
  devops-network:
    driver: bridge
