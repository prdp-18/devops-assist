version: '3.8'

services:
  # Backend API Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-companion-backend
    ports:
      - "8000:8000"
    environment:
      # JWT Configuration
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # AWS Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      
      # GCP Configuration
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/gcp-credentials.json}
      
      # Application Configuration
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
    volumes:
      # SSH Keys for AWS Lightsail access
      - ./ssh-keys:/home/appuser/.ssh:ro
      
      # GCP Service Account Key (if using file-based auth)
      - ${GCP_SERVICE_ACCOUNT_KEY_PATH:-./gcp-credentials.json}:/app/gcp-credentials.json:ro
      
      # Application logs
      - ./logs:/app/logs
      
      # Optional: Mount source code for development
      # - ./backend:/app:ro
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - devops-network

  # Frontend PWA Service
  frontend:
    image: nginx:alpine
    container_name: devops-companion-frontend
    ports:
      - "3000:80"
    volumes:
      - ./web-app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - devops-network

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: devops-companion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - devops-network

  # Optional: Database for user management (if needed)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: devops-companion-db
  #   environment:
  #     - POSTGRES_DB=${POSTGRES_DB:-devops_companion}
  #     - POSTGRES_USER=${POSTGRES_USER:-devops}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - devops-network

  # Optional: Monitoring with Prometheus
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: devops-companion-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/etc/prometheus/console_libraries'
  #     - '--web.console.templates=/etc/prometheus/consoles'
  #   restart: unless-stopped
  #   networks:
  #     - devops-network

volumes:
  redis_data:
  # postgres_data:

networks:
  devops-network:
    driver: bridge