events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Development logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Disable gzip in development for easier debugging
    gzip off;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Development: No caching
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # PWA support
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Service Worker - no cache in development
        location /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # PWA Manifest - no cache in development
        location /manifest.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Development: Allow access to all files
        location ~ /\. {
            # Allow hidden files in development
        }
    }

    # Additional server for testing on port 81
    server {
        listen 81;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Same configuration as port 80
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

