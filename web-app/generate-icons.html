<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <div id="icons"></div>
    
    <script>
        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Draw background circle
            ctx.fillStyle = '#2563eb';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - size/10, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size/3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('DC', size/2, size/2);
            
            return canvas;
        }
        
        function downloadIcon(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Generate all required icons
        const sizes = [16, 32, 72, 96, 128, 144, 152, 192, 384, 512];
        const iconsDiv = document.getElementById('icons');
        
        sizes.forEach(size => {
            const canvas = createIcon(size);
            const filename = `icon-${size}x${size}.png`;
            
            // Add to page for preview
            const div = document.createElement('div');
            div.style.display = 'inline-block';
            div.style.margin = '10px';
            div.style.textAlign = 'center';
            
            const img = document.createElement('img');
            img.src = canvas.toDataURL();
            img.style.border = '1px solid #ccc';
            img.style.marginBottom = '5px';
            
            const button = document.createElement('button');
            button.textContent = `Download ${filename}`;
            button.onclick = () => downloadIcon(canvas, filename);
            
            div.appendChild(img);
            div.appendChild(document.createElement('br'));
            div.appendChild(button);
            iconsDiv.appendChild(div);
        });
        
        console.log('All icons generated! Click the download buttons to save them.');
    </script>
</body>
</html>
